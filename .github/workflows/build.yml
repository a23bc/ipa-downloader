name: Build IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        default: "v0.1.0"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate .xcodeproj
        run: xcodegen generate
        working-directory: ${{ github.workspace }}

      - name: Show project
        run: |
          ls -la
          ls -la IPADownloader.xcodeproj

      - name: Build .app (no code signing)
        run: |
          set -ex
          xcodebuild \
            -project IPADownloader.xcodeproj \
            -scheme IPADownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Locate built .app
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "IPADownloader.app" | head -1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"

      - name: Package unsigned .ipa
        run: |
          set -ex
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ZIP_NAME="IPADownloader-unsigned-${{ github.event.inputs.version }}.ipa"
          zip -qr "$ZIP_NAME" Payload
          mkdir -p output
          mv "$ZIP_NAME" output/
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPADownloader-unsigned-${{ github.event.inputs.version }}
          path: output/*.ipa
          retention-days: 30

      - name: (Optional) Create Release
        if: ${{ github.event.inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: output/*.ipa
          generate_release_notes: true
