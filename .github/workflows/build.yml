name: Build IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (used for artifact name only, e.g. v1.0.0)"
        required: false
        default: "v0.1.0"

# Default GITHUB_TOKEN only needs read permissions for this workflow.
# We do NOT create a release; the .ipa is uploaded as a workflow artifact.
permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcodes
        run: ls /Applications | grep -i xcode

      - name: Select latest Xcode 16
        run: |
          set -ex
          # Find the highest-versioned Xcode 16.x installed on the runner.
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No Xcode 16.x found on runner"
            exit 1
          fi
          echo "Using: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | head -20

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate .xcodeproj
        run: xcodegen generate
        working-directory: ${{ github.workspace }}

      - name: Sanity-check project object version
        run: |
          set -ex
          grep -E "objectVersion" IPADownloader.xcodeproj/project.pbxproj || true
          ls -la IPADownloader.xcodeproj

      - name: Build .app (no code signing)
        run: |
          set -ex
          xcodebuild \
            -project IPADownloader.xcodeproj \
            -scheme IPADownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Locate built .app
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "IPADownloader.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::IPADownloader.app not found in DerivedData"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"

      - name: Package unsigned .ipa
        run: |
          set -ex
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ZIP_NAME="IPADownloader-unsigned-${{ github.event.inputs.version }}.ipa"
          zip -qr "$ZIP_NAME" Payload
          mkdir -p output
          mv "$ZIP_NAME" output/
          ls -la output/
          echo "## Build output" >> $GITHUB_STEP_SUMMARY
          echo "✅ IPA packaged: \`$ZIP_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download it from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPADownloader-unsigned-${{ github.event.inputs.version }}
          path: output/*.ipa
          retention-days: 30
          if-no-files-found: error
